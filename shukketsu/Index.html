<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --blue: #1a73e8; --line: #dadce0; --sub: #5f6368; --A: #d93025; --L: #e37400; --E: #b06000; --K: #1967d2; --S: #7b1fa2; }
  * { box-sizing: border-box; }
  body { font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; margin: 0; font-size: 15px; color: #202124; background: #f6f8fc; -webkit-tap-highlight-color: transparent; }
  header { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 8px; min-height: 52px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; line-height: 1.3; }
  header h1 small { display: block; font-size: 12px; font-weight: normal; color: var(--sub); }
  .back { border: none; background: none; font-size: 15px; color: var(--blue); padding: 6px 4px; cursor: pointer; }
  main { padding: 12px 16px 120px; max-width: 640px; margin: 0 auto; }
  h2 { font-size: 13px; color: var(--sub); margin: 18px 0 8px; }
  button { font: inherit; cursor: pointer; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .dates { display: flex; align-items: center; gap: 8px; }
  .dates input { flex: 1; font: inherit; font-size: 17px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; min-width: 0; }
  .dates button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 12px; }
  .dates .wd { font-weight: bold; min-width: 2em; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
  .per { padding: 14px 0; border: 1px solid var(--line); background: #fff; border-radius: 10px; font-size: 18px; font-weight: bold; position: relative; }
  .per.on { background: var(--blue); color: #fff; border-color: var(--blue); }
  .per .dot { position: absolute; top: 4px; right: 6px; font-size: 10px; color: #188038; }
  .per.on .dot { color: #fff; }
  .course { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 14px; margin-bottom: 8px; border: 1px solid var(--line); background: #fff; border-radius: 12px; font-size: 16px; }
  .course b { flex: 1; }
  .course small { color: var(--sub); font-size: 12px; }
  .course.hint { border: 2px solid var(--blue); background: #e8f0fe; }
  .course.done { border-color: #188038; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #e8f0fe; color: #1967d2; white-space: nowrap; }
  .tag.ok { background: #e6f4ea; color: #137333; }
  .empty { color: var(--sub); font-size: 13px; padding: 8px 0; }
  .rec { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #eee; cursor: pointer; }
  .rec:last-child { border-bottom: none; }
  .rec .p { font-weight: bold; min-width: 3.5em; }
  .rec .c { flex: 1; }
  .rec .n { font-size: 12px; color: var(--sub); text-align: right; }
  .tools { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 18px; }
  .tools button { padding: 12px 4px; border: 1px solid var(--line); background: #fff; border-radius: 12px; font-size: 13px; }
  .tools span { display: block; font-size: 22px; }

  /* 出欠をとる画面 */
  .modes { position: sticky; top: 52px; z-index: 4; background: #f6f8fc; padding: 8px 16px; display: flex; gap: 6px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .mode { flex: 1 0 auto; padding: 8px 10px; border-radius: 18px; border: 2px solid var(--line); background: #fff; font-size: 14px; font-weight: bold; white-space: nowrap; }
  .mode.on { color: #fff; }
  .hintline { font-size: 12px; color: var(--sub); margin: 0 0 8px; }
  .stu { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 6px; border: 1px solid var(--line); background: #fff; border-radius: 10px; user-select: none; }
  .stu .no { width: 3.2em; color: var(--sub); font-size: 12px; text-align: right; flex: 0 0 auto; line-height: 1.2; }
  .stu .nm { flex: 1; font-size: 17px; line-height: 1.25; }
  .stu .nm small { display: block; font-size: 11px; color: var(--sub); }
  .stu .past { font-size: 11px; color: var(--sub); text-align: right; white-space: nowrap; }
  .stu .past.warn { color: var(--A); font-weight: bold; }
  .stu .mk { width: 3.4em; text-align: center; padding: 6px 0; border-radius: 8px; font-weight: bold; font-size: 14px; color: #188038; background: #e6f4ea; flex: 0 0 auto; }
  .stu.marked { border-width: 2px; }
  .stu.marked .mk { color: #fff; }
  .foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: #fff; border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .foot .in { max-width: 640px; margin: 0 auto; }
  .counts { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; margin-bottom: 8px; }
  .counts b { font-size: 16px; }
  .save { width: 100%; padding: 14px; border: none; border-radius: 12px; background: var(--blue); color: #fff; font-size: 17px; font-weight: bold; }
  .save:disabled { opacity: .5; }
  .sub { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .link { border: none; background: none; color: var(--blue); padding: 6px 0; font-size: 14px; }
  .link.danger { color: var(--A); }
  textarea, input[type=text], input[type=number] { width: 100%; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  label.f { display: block; font-size: 13px; color: var(--sub); margin: 12px 0 4px; }

  /* 集計 */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 6px 12px; border: 1px solid var(--line); border-radius: 16px; background: #fff; font-size: 14px; }
  .chip.on { background: #e8f0fe; border-color: var(--blue); color: #1967d2; font-weight: bold; }
  .range { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .range input { flex: 1; min-width: 0; font: inherit; padding: 6px; border: 1px solid var(--line); border-radius: 8px; }
  .tbl { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 6px; border-bottom: 1px solid #eee; text-align: right; white-space: nowrap; }
  th { background: #f8f9fa; font-weight: bold; position: sticky; top: 0; }
  td.l, th.l { text-align: left; }
  tr.warn td { background: #fce8e6; }
  .btn { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--blue); background: #fff; color: var(--blue); font-size: 15px; }
  .btn.primary { background: var(--blue); color: #fff; }
  .btn:disabled { opacity: .5; }
  .note { font-size: 12px; color: var(--sub); margin: 6px 0; }
  .ok { background: #e6f4ea; color: #137333; border-radius: 10px; padding: 10px; margin: 8px 0; font-size: 14px; }
  .warnbox { background: #fef7e0; color: #b06000; border-radius: 10px; padding: 10px; margin: 8px 0; font-size: 14px; }
  .warnbox button { margin-top: 6px; }

  #toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); background: #202124; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 14px; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: .92; }
  #busy { position: fixed; inset: 0; background: rgba(255,255,255,.6); z-index: 30; display: none; align-items: center; justify-content: center; font-size: 15px; color: var(--sub); }
  .ver { text-align: center; font-size: 11px; color: #9aa0a6; margin-top: 24px; }
</style>
</head>
<body>
<div id="app"><main><div class="empty" style="text-align:center;padding:40px 0">読み込み中…</div></main></div>
<div id="toast"></div>
<div id="busy">保存しています…</div>

<script>
  const run = (name, ...args) => new Promise((ok, ng) => google.script.run.withSuccessHandler(ok).withFailureHandler(ng)[name](...args));
  const WD = '日月火水木金土';
  const KIND_COLOR = { A: 'var(--A)', L: 'var(--L)', E: 'var(--E)', K: 'var(--K)', S: 'var(--S)' };
  const DRAFT = 'shukketsu-draft';

  let D = null;              // getInit() の結果
  const ui = { date: '', period: 0 };
  let take = null;           // 出欠をとっている授業 { id, date, period, course, marks, orig, memo, mode, dirty }
  let sum = { course: '', range: '', from: '', to: '' };

  // ───────── 小さな部品 ─────────
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v == null || v === false) return;
      if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'class') el.className = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k in el && k !== 'list') el[k] = v;
      else el.setAttribute(k, v);
    });
    kids.flat().forEach((c) => { if (c != null && c !== false) el.append(c.nodeType ? c : String(c)); });
    return el;
  }
  function screen(headerKids, ...body) {
    const app = document.getElementById('app');
    app.innerHTML = '';
    app.append(h('header', null, headerKids), ...body);
    window.scrollTo(0, 0);
  }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function busy(on, text) {
    const b = document.getElementById('busy');
    b.textContent = text || '保存しています…';
    b.style.display = on ? 'flex' : 'none';
  }
  const errText = (e) => (e && e.message) || String(e);
  const kind = (code) => D.kinds.find((k) => k.code === code);
  const pad = (n) => ('0' + n).slice(-2);
  function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseKey(k) { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(k, n) { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); }
  function wd(k) { return WD[parseKey(k).getDay()]; }
  function md(k) { const p = k.split('-').map(Number); return p[1] + '/' + p[2]; }
  function dayLabel(k) { return md(k) + '（' + wd(k) + '）'; }
  const course = (name) => D.courses.find((c) => c.name === name);
  const stuByKey = () => Object.fromEntries(D.students.map((s) => [s.key, s]));
  function countsText(n) {
    const parts = D.kinds.filter((k) => n[k.code]).map((k) => k.short + n[k.code]);
    return parts.length ? parts.join(' ') : '全員出席';
  }
  function loadDraft() { try { return JSON.parse(localStorage.getItem(DRAFT) || 'null'); } catch (e) { return null; } }
  function putDraft(v) { try { v ? localStorage.setItem(DRAFT, JSON.stringify(v)) : localStorage.removeItem(DRAFT); } catch (e) { /* 保存できない環境でも動く */ } }

  // ───────── ホーム ─────────
  function home() {
    take = null;
    if (!ui.date) ui.date = D.today;
    const dayLessons = D.lessons.filter((l) => l.date === ui.date).sort((a, b) => a.period - b.period);

    // 先週までの同じ曜日・時限によく使った講座（時間割を覚える）
    const hintFor = (p) => {
      const w = parseKey(ui.date).getDay();
      const past = D.lessons.filter((l) => l.period === p && l.date < ui.date && parseKey(l.date).getDay() === w)
        .sort((a, b) => (a.date < b.date ? 1 : -1));
      return past.length ? past[0].course : '';
    };

    const dateRow = h('div', { class: 'dates' },
      h('button', { onclick: () => { ui.date = addDays(ui.date, -1); ui.period = 0; home(); } }, '◀'),
      h('input', { type: 'date', value: ui.date, onchange: (e) => { if (e.target.value) { ui.date = e.target.value; ui.period = 0; home(); } } }),
      h('span', { class: 'wd' }, wd(ui.date)),
      h('button', { onclick: () => { ui.date = addDays(ui.date, 1); ui.period = 0; home(); } }, '▶'),
      ui.date !== D.today ? h('button', { onclick: () => { ui.date = D.today; ui.period = 0; home(); } }, '今日') : null);

    const periods = h('div', { class: 'grid' });
    for (let p = 1; p <= D.periods; p++) {
      const done = dayLessons.some((l) => l.period === p);
      periods.append(h('button', { class: 'per' + (ui.period === p ? ' on' : ''), onclick: () => { ui.period = ui.period === p ? 0 : p; home(); } },
        p, done ? h('span', { class: 'dot' }, '✓') : null));
    }

    const body = h('main', null);
    const draft = loadDraft();
    if (draft && draft.course) {
      body.append(h('div', { class: 'warnbox' },
        '保存されていない出欠があります：' + dayLabel(draft.date) + ' ' + draft.period + '限 ' + draft.course,
        h('div', null,
          h('button', { class: 'btn primary', onclick: () => openTake(draft) }, '開いて保存する'), ' ',
          h('button', { class: 'link danger', onclick: () => { if (confirm('保存されていない出欠を捨てますか？')) { putDraft(null); home(); } } }, '捨てる'))));
    }
    if (!D.students.length || !D.courses.length) {
      body.append(h('div', { class: 'warnbox' },
        !D.students.length ? 'はじめに「⚙ 設定」で名簿を貼り付けてください。' : 'はじめに「⚙ 設定」で、自分の講座（授業）を登録してください。',
        h('div', null, h('button', { class: 'btn primary', onclick: settings }, '⚙ 設定へ'))));
    }

    body.append(h('h2', null, '日付'), dateRow, h('h2', null, '① 時限を選ぶ'), periods);

    if (ui.period) {
      const hint = hintFor(ui.period);
      const list = D.courses.slice().sort((a, b) => (b.name === hint) - (a.name === hint));
      body.append(h('h2', null, '② 講座を選ぶ（' + ui.period + '限）'));
      if (!list.length) body.append(h('div', { class: 'empty' }, '講座がありません。「⚙ 設定」で追加してください。'));
      list.forEach((c) => {
        const rec = dayLessons.find((l) => l.period === ui.period && l.course === c.name);
        body.append(h('button', { class: 'course' + (rec ? ' done' : c.name === hint ? ' hint' : ''), onclick: () => openTake(rec ? { id: rec.id } : { date: ui.date, period: ui.period, course: c.name }) },
          h('b', null, c.name),
          rec ? h('span', { class: 'tag ok' }, '記録ずみ・' + countsText(rec.n)) : c.name === hint ? h('span', { class: 'tag' }, 'いつもの') : null,
          h('small', null, c.members.length + '人')));
      });
    }

    const recs = h('div', { class: 'card' });
    if (!dayLessons.length) recs.append(h('div', { class: 'empty' }, 'まだ記録はありません'));
    dayLessons.forEach((l) => recs.append(h('div', { class: 'rec', onclick: () => openTake({ id: l.id }) },
      h('span', { class: 'p' }, l.period + '限'), h('span', { class: 'c' }, l.course), h('span', { class: 'n' }, countsText(l.n)))));
    body.append(h('h2', null, dayLabel(ui.date) + 'の記録'), recs);

    body.append(h('div', { class: 'tools' },
      h('button', { onclick: () => records() }, h('span', null, '🗂'), '記録の一覧'),
      h('button', { onclick: () => summary() }, h('span', null, '📊'), '集計'),
      h('button', { onclick: settings }, h('span', null, '⚙'), '設定')));
    body.append(h('div', { class: 'ver' }, '版 ' + D.version));

    screen([h('h1', null, '授業の出欠', h('small', null, dayLabel(D.today) + ' ・ ' + D.fy + '年度'))]);
    document.getElementById('app').append(body);
  }

  // ───────── 出欠をとる ─────────
  async function openTake(o) {
    let t;
    if (o.marks) {
      t = Object.assign({}, o); // 保存されていなかった下書き
      t.orig = t.orig || {};
    } else if (o.id) {
      busy(true, '読み込み中…');
      try { t = await run('getLesson', o.id); } catch (e) { busy(false); alert(errText(e)); return; }
      busy(false);
      t.orig = Object.assign({}, t.marks);
    } else {
      t = { date: o.date, period: o.period, course: o.course, marks: {}, orig: {}, memo: '' };
    }
    if (!course(t.course)) { alert('講座「' + t.course + '」は設定にありません（消されたかもしれません）。'); putDraft(null); return; }
    t.mode = t.mode || 'A';
    t.dirty = !!o.marks;
    take = t;
    drawTake();
  }

  function drawTake() {
    const t = take;
    const c = course(t.course);
    const byKey = stuByKey();
    // 名簿にいる対象の生徒 ＋ 記録はあるが対象から外れた生徒
    const keys = c.members.concat(Object.keys(t.marks).filter((k) => !c.members.includes(k) && byKey[k]));
    const tally = (D.tally[t.course] || {});
    const limit = c.limit || 0;

    const modes = h('div', { class: 'modes' }, D.kinds.map((k) => h('button', {
      class: 'mode' + (t.mode === k.code ? ' on' : ''),
      style: 'border-color:' + KIND_COLOR[k.code] + ';' + (t.mode === k.code ? 'background:' + KIND_COLOR[k.code] : 'color:' + KIND_COLOR[k.code]),
      onclick: () => { t.mode = k.code; drawTake(); },
    }, k.label)));

    const list = h('div', null);
    keys.forEach((key) => {
      const s = byKey[key];
      const code = t.marks[key];
      // これまで（この授業より前に保存したもの）＋ 今つけた分
      const past = Object.assign({}, tally[key] || {});
      if (t.orig[key]) past[t.orig[key]] = (past[t.orig[key]] || 1) - 1;
      const kek = (past.A || 0) + (D.lateRule ? Math.floor(((past.L || 0) + (past.E || 0)) / D.lateRule) : 0);
      const pastTxt = D.kinds.filter((k) => past[k.code]).map((k) => k.short + past[k.code]).join(' ');
      const btn = h('button', {
        class: 'stu' + (code ? ' marked' : ''),
        style: code ? 'border-color:' + KIND_COLOR[code] : '',
        onclick: () => {
          if (t.marks[key] === t.mode) delete t.marks[key]; else t.marks[key] = t.mode;
          t.dirty = true;
          putDraft(t);
          drawTake();
        },
      },
        h('span', { class: 'no' }, s.cls, h('br'), s.no !== '' ? s.no + '番' : ''),
        h('span', { class: 'nm' }, s.name, s.kana ? h('small', null, s.kana) : null),
        pastTxt ? h('span', { class: 'past' + (limit && kek >= limit ? ' warn' : '') }, 'これまで', h('br'), pastTxt) : null,
        h('span', { class: 'mk', style: code ? 'background:' + KIND_COLOR[code] : '' }, code ? kind(code).label : '出席'));
      list.append(btn);
    });

    const n = { A: 0, L: 0, E: 0, K: 0, S: 0 };
    Object.values(t.marks).forEach((code) => { n[code] = (n[code] || 0) + 1; });
    const present = keys.length - n.A - n.K - n.S;

    const memo = h('textarea', { rows: 2, placeholder: '授業メモ（なくてもよい）例：L5 本文', value: t.memo || '', oninput: (e) => { t.memo = e.target.value; t.dirty = true; putDraft(t); } });

    const body = h('main', null,
      h('p', { class: 'hintline' }, '全員「出席」から始まります。上で区分を選んで、名前を押してください（もう一度押すと出席に戻ります）。'),
      list.childNodes.length ? list : h('div', { class: 'empty' }, 'この講座の対象の生徒がいません。「⚙ 設定」で講座の対象クラスを確かめてください。'),
      h('label', { class: 'f' }, '授業メモ'), memo,
      h('div', { class: 'sub' },
        Object.keys(t.marks).length ? h('button', { class: 'link', onclick: () => { if (confirm('全員を「出席」にもどしますか？')) { t.marks = {}; t.dirty = true; putDraft(t); drawTake(); } } }, '全員を出席にもどす') : null,
        t.id ? h('button', { class: 'link danger', onclick: () => removeLesson(t) }, 'この授業の記録を消す') : null));

    const foot = h('div', { class: 'foot' }, h('div', { class: 'in' },
      h('div', { class: 'counts' }, h('span', null, '出席 ', h('b', null, present), '/' + keys.length),
        D.kinds.filter((k) => n[k.code]).map((k) => h('span', { style: 'color:' + KIND_COLOR[k.code] }, k.label + ' ', h('b', null, n[k.code])))),
      h('button', { class: 'save', onclick: saveTake }, t.id ? '保存する（記録を直す）' : '保存する')));

    const y = window.scrollY;
    screen([
      h('button', { class: 'back', onclick: leaveTake }, '◀ 戻る'),
      h('h1', null, t.course, h('small', null, dayLabel(t.date) + ' ' + t.period + '限' + (t.id ? ' ・ 記録ずみ' : ''))),
    ], modes, body, foot);
    window.scrollTo(0, y);
  }

  function leaveTake() {
    if (take && take.dirty && !confirm('保存していない変更があります。保存せずに戻りますか？')) return;
    putDraft(null);
    home();
  }

  async function saveTake() {
    const t = take;
    busy(true);
    try {
      const r = await run('saveLesson', { id: t.id || '', date: t.date, period: t.period, course: t.course, marks: t.marks, memo: t.memo || '' });
      D = r.init;
      putDraft(null);
      ui.date = t.date; ui.period = 0;
      busy(false);
      toast('✓ 保存しました（' + t.period + '限 ' + t.course + '）');
      home();
    } catch (e) {
      busy(false);
      alert('保存できませんでした。電波のよいところで、もう一度「保存する」を押してください。\n（入力した出欠はこの端末に残っています）\n\n' + errText(e));
    }
  }

  async function removeLesson(t) {
    if (!confirm(dayLabel(t.date) + ' ' + t.period + '限 ' + t.course + ' の記録を消しますか？')) return;
    busy(true, '消しています…');
    try { D = await run('deleteLesson', t.id); putDraft(null); busy(false); toast('記録を消しました'); home(); }
    catch (e) { busy(false); alert(errText(e)); }
  }

  // ───────── 記録の一覧 ─────────
  function records(name) {
    const sel = name || (D.courses[0] && D.courses[0].name) || '';
    const chips = h('div', { class: 'chips' }, D.courses.map((c) => h('button', { class: 'chip' + (c.name === sel ? ' on' : ''), onclick: () => records(c.name) }, c.name)));
    const ls = D.lessons.filter((l) => l.course === sel).sort((a, b) => (a.date === b.date ? b.period - a.period : a.date < b.date ? 1 : -1));
    const card = h('div', { class: 'card' });
    if (!ls.length) card.append(h('div', { class: 'empty' }, 'まだ記録はありません'));
    ls.forEach((l) => card.append(h('div', { class: 'rec', onclick: () => openTake({ id: l.id }) },
      h('span', { class: 'p' }, dayLabel(l.date)), h('span', { class: 'c' }, l.period + '限' + (l.memo ? '　' + l.memo : '')), h('span', { class: 'n' }, countsText(l.n)))));
    screen([h('button', { class: 'back', onclick: home }, '◀ 戻る'), h('h1', null, '記録の一覧')],
      h('main', null, chips, h('h2', null, sel + '（' + ls.length + '回）'), card));
  }

  // ───────── 集計 ─────────
  function summary() {
    if (!sum.course || !course(sum.course)) sum.course = (D.courses[0] && D.courses[0].name) || '';
    if (!sum.range) {
      const now = D.terms.find((t) => t.from <= D.today && D.today <= t.to);
      if (now) { sum.range = now.name; sum.from = now.from; sum.to = now.to; } else { sum.range = '年度'; sum.from = D.fy + '-04-01'; sum.to = (D.fy + 1) + '-03-31'; }
    }
    const ranges = D.terms.concat([{ name: '年度', from: D.fy + '-04-01', to: (D.fy + 1) + '-03-31' }]);
    const from = h('input', { type: 'date', value: sum.from, onchange: (e) => { sum.from = e.target.value; sum.range = ''; summary(); } });
    const to = h('input', { type: 'date', value: sum.to, onchange: (e) => { sum.to = e.target.value; sum.range = ''; summary(); } });
    const out = h('div', null, h('div', { class: 'empty' }, '集計しています…'));

    const body = h('main', null,
      h('h2', null, '講座'),
      h('div', { class: 'chips' }, D.courses.map((c) => h('button', { class: 'chip' + (c.name === sum.course ? ' on' : ''), onclick: () => { sum.course = c.name; summary(); } }, c.name))),
      h('h2', null, '期間'),
      h('div', { class: 'chips' }, ranges.map((r) => h('button', { class: 'chip' + (r.name === sum.range ? ' on' : ''), onclick: () => { Object.assign(sum, { range: r.name, from: r.from, to: r.to }); summary(); } }, r.name))),
      h('div', { class: 'range' }, from, '〜', to),
      h('h2', null, '結果'), out);
    screen([h('button', { class: 'back', onclick: home }, '◀ 戻る'), h('h1', null, '集計')], body);
    if (!sum.course) { out.innerHTML = ''; out.append(h('div', { class: 'empty' }, '講座がありません')); return; }

    async function load() {
      out.innerHTML = ''; out.append(h('div', { class: 'empty' }, '集計しています…'));
      let r;
      try { r = await run('getSummary', { course: sum.course, from: sum.from, to: sum.to }); }
      catch (e) { out.innerHTML = ''; out.append(h('div', { class: 'warnbox' }, errText(e))); return; }
      out.innerHTML = '';
      const rule = r.lateRule ? '欠課時数＝欠課＋遅刻・早退' + r.lateRule + '回で1' : '欠課時数＝欠課（公欠・出停・忌引は数えない）';
      out.append(h('div', { class: 'note' }, '授業 ' + r.held + '回 ・ ' + rule + (r.limit ? ' ・ 赤は欠課時数 ' + r.limit + ' 以上' : '')));
      const tb = h('tbody', null, r.rows.map((x) => h('tr', { class: r.limit && x.kekka >= r.limit ? 'warn' : '' },
        h('td', { class: 'l' }, x.cls + ' ' + x.no), h('td', { class: 'l' }, x.name),
        h('td', null, h('b', null, x.kekka)), h('td', null, x.A), h('td', null, x.L), h('td', null, x.E), h('td', null, x.K), h('td', null, x.S))));
      out.append(h('div', { class: 'tbl' }, h('table', null,
        h('thead', null, h('tr', null, ['番号', '氏名'].map((t) => h('th', { class: 'l' }, t)), ['欠課時数', '欠課', '遅刻', '早退', '公欠', '出停'].map((t) => h('th', null, t)))), tb)));
      const done = h('div', null);
      const btn = h('button', { class: 'btn', onclick: async () => {
        btn.disabled = true;
        try {
          const url = await run('exportSummary', { course: sum.course, from: sum.from, to: sum.to });
          done.innerHTML = '';
          done.append(h('div', { class: 'ok' }, '✓ シートに書き出しました。 ', h('a', { href: url, target: '_blank' }, 'シートを開く')));
        } catch (e) { alert(errText(e)); }
        btn.disabled = false;
      } }, '📄 シートに書き出す（印刷用）');
      out.append(h('div', { class: 'sub' }, btn), done);
    }
    load();
  }

  // ───────── 設定 ─────────
  function settings() {
    const body = h('main', null);
    body.append(h('h2', null, '講座（自分の授業）'));
    const cl = h('div', { class: 'card' });
    if (!D.courses.length) cl.append(h('div', { class: 'empty' }, 'まだありません'));
    D.courses.forEach((c) => cl.append(h('div', { class: 'rec', onclick: () => courseForm(c) },
      h('span', { class: 'c' }, h('b', null, c.name), h('br'), h('small', null, '対象：' + c.target + (c.limit ? ' ・ 注意 ' + c.limit + '時間' : ''))),
      h('span', { class: 'n' }, c.members.length + '人 ›'))));
    body.append(cl, h('button', { class: 'btn primary', onclick: () => courseForm(null) }, '＋ 講座を追加'));

    body.append(h('h2', null, '名簿'),
      h('div', { class: 'card' }, '登録ずみ ' + D.students.length + '人（' + (D.classes.join('・') || 'なし') + '）',
        h('div', { class: 'sub' }, h('button', { class: 'btn', onclick: rosterForm }, '👥 名簿を貼り付ける'))));

    const per = h('input', { type: 'number', min: 1, max: 12, value: D.periods });
    const late = h('input', { type: 'number', min: 0, value: D.lateRule || '', placeholder: '空欄＝数えない' });
    const terms = h('textarea', { rows: 3, value: D.termsText });
    const saveBtn = h('button', { class: 'btn primary', onclick: async () => {
      busy(true);
      try { D = await run('saveSettings', { periods: per.value, lateRule: late.value, terms: terms.value }); busy(false); toast('✓ 設定を保存しました'); settings(); }
      catch (e) { busy(false); alert(errText(e)); }
    } }, '保存する');
    body.append(h('h2', null, 'そのほか'), h('div', { class: 'card' },
      h('label', { class: 'f' }, '1日の時限の数'), per,
      h('label', { class: 'f' }, '遅刻・早退を何回で欠課1にするか'), late,
      h('label', { class: 'f' }, '学期の区切り（集計のボタンになります）'), terms,
      h('div', { class: 'note' }, '例：1学期 4/1-7/31, 2学期 8/1-12/31, 3学期 1/1-3/31（前期・後期でも可）'),
      h('div', { class: 'sub' }, saveBtn)));
    body.append(h('div', { class: 'note' }, h('a', { href: D.sheetUrl, target: '_blank' }, 'スプレッドシートを開く'), '（記録を直接直すこともできます）'));
    screen([h('button', { class: 'back', onclick: home }, '◀ 戻る'), h('h1', null, '設定')], body);
  }

  function courseForm(c) {
    const name = h('input', { type: 'text', value: c ? c.name : '', placeholder: '例：1-1 英語コミュⅠ' });
    const chosen = new Set();
    const extra = [];
    (c ? c.target.split(/\s*,\s*/) : []).forEach((t) => { if (D.classes.includes(t)) chosen.add(t); else if (t) extra.push(t); });
    const chips = h('div', { class: 'chips' });
    function drawChips() {
      chips.innerHTML = '';
      D.classes.forEach((k) => chips.append(h('button', { class: 'chip' + (chosen.has(k) ? ' on' : ''), onclick: () => { chosen.has(k) ? chosen.delete(k) : chosen.add(k); drawChips(); } }, k)));
      if (!D.classes.length) chips.append(h('div', { class: 'empty' }, '名簿がまだありません'));
    }
    drawChips();
    const more = h('input', { type: 'text', value: extra.join(', '), placeholder: '例：1105, 1203, 2111' });
    const limit = h('input', { type: 'number', min: 0, value: c && c.limit ? c.limit : '', placeholder: '空欄＝なし' });
    const save = h('button', { class: 'btn primary', onclick: async () => {
      const target = Array.from(chosen).concat(more.value.split(/[,、\s]+/).filter(Boolean)).join(', ');
      busy(true);
      try {
        D = await run('saveCourse', { oldName: c ? c.name : '', name: name.value, target: target, limit: limit.value, memo: c ? c.memo : '' });
        busy(false); toast('✓ 講座を保存しました'); settings();
      } catch (e) { busy(false); alert(errText(e)); }
    } }, '保存する');
    const del = c ? h('button', { class: 'link danger', onclick: async () => {
      if (!confirm('講座「' + c.name + '」を設定から消しますか？\n（これまでの出欠の記録はシートに残ります）')) return;
      busy(true, '消しています…');
      try { D = await run('deleteCourse', c.name); busy(false); settings(); } catch (e) { busy(false); alert(errText(e)); }
    } }, 'この講座を消す') : null;
    screen([h('button', { class: 'back', onclick: settings }, '◀ 戻る'), h('h1', null, c ? '講座を直す' : '講座を追加')],
      h('main', null,
        h('label', { class: 'f' }, '講座名'), name,
        h('label', { class: 'f' }, '対象のクラス（押して選ぶ・いくつでも）'), chips,
        h('label', { class: 'f' }, '個別の生徒（選択授業など。学籍番号を「,」区切りで）'), more,
        h('label', { class: 'f' }, '注意する欠課時数（これ以上になると赤で表示）'), limit,
        h('div', { class: 'note' }, '例：年間35時間の授業で「3分の1をこえると未履修」なら 11 など'),
        h('div', { class: 'sub' }, save, del)));
  }

  // 名簿の貼り付け（課題提出バーコード管理と同じ読み取り方）
  const isKana = (c) => /^[ぁ-んァ-ヶー・\s]+$/.test(c);
  const hasKanji = (c) => /[一-鿿々]/.test(c);
  function parseLine(line) {
    const n = line.normalize('NFKC').replace(/　/g, ' ').trim();
    if (!n) return null;
    let cells;
    if (n.includes('\t')) cells = n.split('\t');
    else if (n.includes(',')) cells = n.split(',');
    else cells = n.split(/\s+/);
    const byTab = n.includes('\t') || n.includes(',');
    cells = cells.map((c) => c.trim()).filter(Boolean);
    if (!/\d/.test(n) && /氏名|名前|学籍|番号|ふりがな|フリガナ|クラス/.test(n)) return { header: true };
    let gk = '', grade = '', cls = '', no = '';
    const small = [], text = [];
    cells.forEach((c) => {
      let m;
      if (!gk && /^\d{4}$/.test(c)) gk = c;
      else if ((m = c.match(/^(\d)\s*(?:-|年)\s*(\d{1,2})\s*組?$/))) { grade = m[1]; cls = m[2]; }
      else if ((m = c.match(/^(\d)\s*年$/))) grade = m[1];
      else if ((m = c.match(/^(\d{1,2})\s*組$/))) cls = m[1];
      else if ((m = c.match(/^(\d{1,2})\s*番?$/))) small.push(m[1]);
      else if (/^[\d\-\/]+$/.test(c)) { /* 生徒ID・電話番号などの数字は使わない */ }
      else text.push(c.replace(/\s+/g, ' '));
    });
    if (!gk) {
      if (grade && cls && small.length) no = small[0];
      else if (small.length >= 3) { grade = small[0]; cls = small[1]; no = small[2]; }
      if (grade && cls && no && Number(grade) <= 9 && Number(cls) <= 9) gk = grade + cls + String(no).padStart(2, '0');
    }
    let kana = '';
    if (byTab && text.length >= 2) {
      const i = text.findIndex((c, k) => isKana(c) && (c.includes(' ') || c.length >= 5) && text.some((o, j) => j !== k && hasKanji(o)));
      if (i >= 0) kana = text.splice(i, 1)[0];
    } else if (!byTab && text.length >= 3 && isKana(text[text.length - 1]) && isKana(text[text.length - 2]) && text.slice(0, -2).some(hasKanji)) {
      kana = text.splice(-2).join(' ');
    }
    const name = text.join(' ').trim();
    if (!name || !gk) return { bad: line };
    return { gakuseki: gk, name, kana };
  }

  function rosterForm() {
    let parsed = [];
    const ta = h('textarea', { rows: 8, placeholder: 'ここに貼り付け' });
    const out = h('div', null);
    const save = h('button', { class: 'btn primary', disabled: true }, '② この内容で登録する');
    const check = h('button', { class: 'btn', onclick: async () => {
      parsed = []; const bad = [];
      ta.value.split('\n').forEach((l) => { const r = parseLine(l); if (!r || r.header) return; if (r.bad) bad.push(r.bad); else parsed.push(r); });
      out.innerHTML = '';
      if (!parsed.length) { out.append(h('div', { class: 'warnbox' }, '生徒の行が見つかりませんでした。学籍番号（1101 など）か「学年・組・番号」と氏名が入った表を貼ってください。')); return; }
      let plan;
      try { plan = await run('previewRoster', parsed); } catch (e) { alert(errText(e)); return; }
      const cnt = { new: 0, update: 0, same: 0 };
      plan.forEach((p) => cnt[p.kind]++);
      out.append(h('div', { class: 'ok' }, '追加 ' + cnt.new + '人 ・ 更新 ' + cnt.update + '人 ・ 変更なし ' + cnt.same + '人'));
      if (bad.length) out.append(h('div', { class: 'warnbox' }, '読み取れない行（登録しません）：' + bad.length + '行', h('br'), h('small', null, bad.slice(0, 5).join(' ／ '))));
      out.append(h('div', { class: 'tbl' }, h('table', null, h('tbody', null, plan.map((p) => h('tr', null,
        h('td', { class: 'l' }, p.gakuseki), h('td', { class: 'l' }, p.name), h('td', { class: 'l' }, p.kana),
        h('td', { class: 'l' }, { new: '追加', update: '更新（前：' + p.before + '）', same: '変更なし' }[p.kind])))))));
      save.disabled = !(cnt.new + cnt.update);
    } }, '① 読み取って確認する');
    ta.addEventListener('input', () => { save.disabled = true; });
    save.onclick = async () => {
      busy(true);
      try {
        const r = await run('importRoster', parsed);
        D = r.init; busy(false);
        toast('✓ 名簿に登録しました（追加 ' + r.added + '人・更新 ' + r.updated + '人）');
        settings();
      } catch (e) { busy(false); alert(errText(e)); }
    };
    screen([h('button', { class: 'back', onclick: settings }, '◀ 戻る'), h('h1', null, '名簿を貼り付ける')],
      h('main', null,
        h('p', null, 'Excel・校務システムの名簿から、生徒の行をまとめてコピーして貼り付けてください。列の順番はそのままでかまいません。'),
        h('div', { class: 'note' }, '読み取れる形の例：「1101　青木 さくら」／「1　1　1　青木　さくら」（学年・組・番号が別の列）／「1年1組　1番　青木さくら　あおき さくら」'),
        ta, h('div', { class: 'sub' }, check, save), out,
        h('div', { class: 'note' }, '同じ学籍番号の生徒は名前だけ新しくなります。転出した生徒は、シート「名簿」の「除外」に ✓ を付けてください。')));
  }

  // ───────── はじめ ─────────
  window.addEventListener('beforeunload', (e) => { if (take && take.dirty) { e.preventDefault(); e.returnValue = ''; } });
  run('getInit').then((d) => { D = d; home(); }).catch((e) => {
    document.getElementById('app').innerHTML = '';
    document.getElementById('app').append(h('main', null, h('div', { class: 'warnbox' }, '読み込めませんでした：' + errText(e), h('br'), h('button', { class: 'btn', onclick: () => location.reload() }, 'もう一度'))));
  });
</script>
