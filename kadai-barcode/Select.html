<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body { font-family: "Noto Sans JP", sans-serif; margin: 0; padding: 10px 14px; font-size: 13px; color: #222; }
  h3 { margin: 10px 0 4px; font-size: 14px; }
  .box { border: 1px solid #ddd; border-radius: 6px; padding: 6px 8px; max-height: 230px; overflow: auto; }
  .box label { display: block; padding: 2px 0; }
  .box label.over { color: #c5221f; }
  .classes label { display: inline-block; margin-right: 12px; }
  .tools { margin: 4px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tools button { font-size: 12px; padding: 2px 8px; }
  .actions { margin-top: 12px; display: flex; gap: 10px; }
  .actions button { font-size: 14px; padding: 8px 14px; cursor: pointer; border-radius: 4px; border: 1px solid #1a73e8; background: #fff; color: #1a73e8; }
  .actions button.primary { background: #1a73e8; color: #fff; }
  #result { margin-top: 12px; padding: 10px; border-radius: 6px; display: none; }
  #result.ok { display: block; background: #e6f4ea; }
  #result.err { display: block; background: #fce8e6; color: #c5221f; }
  #result a { font-size: 15px; font-weight: bold; }
  .small { color: #666; font-size: 12px; }
  .printBtn { margin: 6px 0 4px; font-size: 15px; font-weight: bold; padding: 8px 16px; border: none; border-radius: 6px; background: #1a73e8; color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <h3>1. 課題を選ぶ</h3>
  <div class="tools">
    教科 <select id="subject"><option value="">すべて</option></select>
    <span id="teacherWrap">担当 <select id="teacher"><option value="">すべて</option></select></span>
    <button id="allT">すべて選ぶ</button>
    <button id="overT">締切を過ぎたものだけ選ぶ</button>
    <button id="noneT">選ぶのをやめる</button>
  </div>
  <div class="box" id="tasks"></div>
  <div class="small">赤字は締切を過ぎた課題です。</div>

  <h3>2. クラスを選ぶ（選ばなければ全員）</h3>
  <div class="box classes" id="classes"></div>

  <h3>3. 作るもの</h3>
  <label><input type="checkbox" id="overdueOnly"> 締切を過ぎた課題だけにする</label>
  <div class="actions">
    <button class="primary" id="missing">未提出者リスト（先生用）</button>
    <button class="primary" id="notice">課題提出について（生徒に配る）</button>
  </div>
  <div class="small">「課題提出について」は、選んだ課題のうち出していないものを生徒ごとに1枚にまとめます（切り取って渡せます）。</div>
  <div id="result"></div>

<script>
  const DATA = <?!= payload ?>;
  const $ = (id) => document.getElementById(id);

  function isOver(t) { return t.due && DATA.today > t.due; }

  function renderTasks() {
    const subj = $('subject').value;
    const who = $('teacher').value;
    const box = $('tasks');
    const checked = new Set([...box.querySelectorAll('input:checked')].map((i) => i.value));
    box.innerHTML = '';
    DATA.tasks.filter((t) => (!subj || t.subject === subj) && (!who || t.teacher === who)).forEach((t) => {
      const lab = document.createElement('label');
      if (isOver(t)) lab.className = 'over';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.value = t.id; cb.checked = checked.has(t.id);
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(' ' + (t.subject ? '【' + t.subject + '】' : '') + t.name +
        (t.teacher ? '［' + t.teacher + '］' : '') +
        (t.due ? '（締切 ' + t.due.slice(5).replace(/^0/, '').replace('-0', '-').replace('-', '/') + '）' : '') + (t.classes ? '　対象：' + t.classes : '')));
      box.appendChild(lab);
    });
    if (!box.children.length) box.textContent = '課題がありません';
  }

  [...new Set(DATA.tasks.map((t) => t.subject).filter(String))].forEach((s) => $('subject').appendChild(new Option(s, s)));
  DATA.classes.forEach((c) => {
    const lab = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.value = c; cb.checked = (DATA.myClasses || []).includes(c); // 担当クラスに最初からチェック
    lab.appendChild(cb);
    lab.appendChild(document.createTextNode(' ' + c));
    $('classes').appendChild(lab);
  });
  $('subject').addEventListener('change', renderTasks);
  // 共有して使うとき：担当でしぼりこむ（自分の課題があれば、最初は自分の課題だけ）
  const teachers = [...new Set(DATA.tasks.map((t) => t.teacher).filter(String))];
  teachers.forEach((n) => $('teacher').appendChild(new Option(n, n)));
  if (teachers.length < 2) $('teacherWrap').style.display = 'none';
  else if (DATA.me && teachers.includes(DATA.me)) $('teacher').value = DATA.me;
  $('teacher').addEventListener('change', () => { renderTasks(); $('overT').click(); });
  $('allT').addEventListener('click', () => $('tasks').querySelectorAll('input').forEach((i) => { i.checked = true; }));
  $('noneT').addEventListener('click', () => $('tasks').querySelectorAll('input').forEach((i) => { i.checked = false; }));
  $('overT').addEventListener('click', () => $('tasks').querySelectorAll('input').forEach((i) => {
    i.checked = isOver(DATA.tasks.find((t) => t.id === i.value));
  }));

  function make(type) {
    const taskIds = [...$('tasks').querySelectorAll('input:checked')].map((i) => i.value);
    const classes = [...$('classes').querySelectorAll('input:checked')].map((i) => i.value);
    const r = $('result');
    if (!taskIds.length) { r.className = 'err'; r.textContent = '課題を1つ以上選んでください'; return; }
    r.className = 'ok'; r.textContent = '作成中…';
    document.querySelectorAll('.actions button').forEach((b) => { b.disabled = true; });
    google.script.run.withSuccessHandler((res) => {
      document.querySelectorAll('.actions button').forEach((b) => { b.disabled = false; });
      r.className = 'ok';
      r.innerHTML = '';
      const p = document.createElement('div');
      p.textContent = '「' + res.sheetName + '」シートに作りました（' + (type === 'notice' ? '対象 ' + res.count + '人' : '未提出 のべ ' + res.count + '人') + '）。';
      r.appendChild(p);
      if (res.slips && res.slips.length) {
        // 課題提出について：ページの境目で短冊が切れないよう、ブラウザの印刷を使う（PDFにするときは、印刷先で「PDFに保存」）
        const b = document.createElement('button');
        b.className = 'printBtn'; b.textContent = '🖨 印刷する（短冊がページで切れません）';
        b.onclick = () => printSlips(res.slips);
        const h = document.createElement('div');
        h.className = 'small'; h.textContent = 'PDFがほしいときは、印刷の画面で送信先（プリンタ）を「PDFに保存」にしてください。';
        r.appendChild(b); r.appendChild(h);
        return;
      }
      const a = document.createElement('a');
      a.href = res.pdfUrl; a.target = '_blank'; a.textContent = '📄 PDFで開いて印刷する';
      r.appendChild(a);
    }).withFailureHandler((e) => {
      document.querySelectorAll('.actions button').forEach((b) => { b.disabled = false; });
      r.className = 'err'; r.textContent = 'エラー：' + (e && e.message || e);
    }).makePrintList({ type, taskIds, classes, overdueOnly: $('overdueOnly').checked });
  }
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function printSlips(slips) {
    const w = window.open('', '_blank');
    if (!w) { alert('ポップアップがブロックされました。アドレスバー右のマークから許可してください。'); return; }
    const css = '@page{size:A4;margin:10mm}' +
      'body{margin:0;font-family:"Noto Sans JP",sans-serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
      '.bar{padding:10px;background:#f1f3f4;text-align:center}.bar button{font-size:16px;padding:8px 18px}' +
      '@media print{.bar{display:none}}' +
      '.slip{break-inside:avoid;page-break-inside:avoid;padding-bottom:2mm}' +
      '.box{border:1px solid #888;padding:2mm 3mm}' +
      '.head{display:flex;justify-content:space-between;align-items:center;font-size:16pt;font-weight:bold}' +
      '.head .t{font-size:13pt;font-weight:normal}' +
      '.who{font-size:20pt;font-weight:bold;margin:1.5mm 0}' +
      '.msg{font-size:13pt;margin:1mm 0 1.5mm;white-space:pre-wrap}' +
      'table{width:100%;border-collapse:collapse;font-size:15pt}td{padding:1mm 1.5mm;vertical-align:middle}' +
      'td.c{width:10mm;text-align:center;font-size:18pt}td.s{width:28mm}td.d{width:32mm;white-space:nowrap}' +
      '.cut{text-align:center;color:#999;font-size:11pt;letter-spacing:2px;margin-top:2mm;overflow:hidden;white-space:nowrap}';
    const body = slips.map((s) => '<div class="slip"><div class="box">' +
      '<div class="head"><span>' + esc(s.head) + '</span><span class="t">' + esc(s.teacher) + '</span></div>' +
      '<div class="who">' + esc(s.who) + '</div>' +
      (s.message ? '<div class="msg">' + esc(s.message) + '</div>' : '') +
      '<table>' + s.items.map((it) => '<tr><td class="c">□</td><td class="s">' + esc(it[0]) + '</td><td>' + esc(it[1]) + '</td><td class="d">' + esc(it[2]) + '</td></tr>').join('') + '</table>' +
      '</div><div class="cut">✂ ' + '- '.repeat(60) + '</div></div>').join('');
    w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>課題提出について</title><style>' + css + '</style></head><body>' +
      '<div class="bar"><button onclick="print()">🖨 印刷する</button></div>' + body + '</body></html>');
    w.document.close();
    setTimeout(() => w.print(), 500);
  }
  $('missing').addEventListener('click', () => make('missing'));
  $('notice').addEventListener('click', () => make('notice'));

  renderTasks();
  $('overT').click();
</script>
</body>
</html>
