<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body { font-family: "Noto Sans JP", sans-serif; margin: 0; padding: 10px; font-size: 13px; color: #202124; }
  a.back { color: #1a73e8; text-decoration: none; font-size: 12px; cursor: pointer; }
  label.f { display: block; margin: 12px 0 4px; font-weight: bold; }
  label.f small { font-weight: normal; color: #5f6368; }
  input[type=text], input[type=date] { width: 100%; box-sizing: border-box; padding: 7px; font-size: 14px; border: 1px solid #dadce0; border-radius: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .chip { padding: 4px 10px; border: 1px solid #dadce0; border-radius: 14px; background: #fff; font-size: 12px; cursor: pointer; user-select: none; }
  .chip.on { background: #e8f0fe; border-color: #1a73e8; color: #1967d2; font-weight: bold; }
  .go { display: block; width: 100%; padding: 12px; margin-top: 16px; border: none; border-radius: 10px; background: #1a73e8; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; }
  .sub { display: block; width: 100%; padding: 8px; margin-top: 6px; border: 1px solid #dadce0; border-radius: 10px; background: #fff; font-size: 13px; cursor: pointer; }
  button:disabled { opacity: .5; }
  #msg { margin-top: 10px; padding: 8px; border-radius: 8px; display: none; }
  #msg.ok { display: block; background: #e6f4ea; color: #137333; }
  #msg.err { display: block; background: #fce8e6; color: #c5221f; }
  .hint { color: #5f6368; font-size: 11px; margin-top: 3px; }
  .late { margin-top: 12px; border-radius: 10px; padding: 8px; background: #f8f9fa; }
  .late.ask { background: #fef7e0; border: 2px solid #f9ab00; }
  .first { display: none; color: #b06000; font-weight: bold; font-size: 12px; margin-bottom: 6px; }
  .late.ask .first { display: block; }
  .opts label { display: block; padding: 6px 4px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .opts label.on { background: #e8f0fe; }
  .opts small { display: block; color: #5f6368; font-size: 11px; margin-left: 20px; }
  .days { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 0 20px; }
  .days .chip { padding: 2px 9px; }
</style>
</head>
<body>
  <a class="back" id="back">← ホームへ</a>

  <label class="f">教科 <small>（空欄でもOK）</small></label>
  <input type="text" id="subject" list="subjects" placeholder="例：数学">
  <datalist id="subjects"></datalist>
  <div class="chips" id="subjectChips"></div>

  <label class="f">課題名 <small>（空欄でもOK）</small></label>
  <input type="text" id="name" placeholder="例：ワーク p.20〜25">

  <label class="f">担当 <small>（あなたの名前。共有して使うとき、だれの課題か分かるように）</small></label>
  <input type="text" id="teacher" placeholder="例：青柳">

  <label class="f">提出するクラス</label>
  <div class="chips" id="classes"></div>
  <div class="hint">何も選ばなければ全員が対象です</div>

  <label class="f">締切日</label>
  <input type="date" id="due">
  <div class="chips" id="dueChips"></div>

  <div class="late" id="lateBox">
    <div class="first" id="lateFirst">はじめに決めてください（次からは同じ選び方が最初から入ります）</div>
    <label class="f" style="margin-top:0">締切を過ぎて出したら？</label>
    <div class="opts" id="lateOpts">
      <label data-v="strict"><input type="radio" name="late"> 遅れとして記録する<small>教務手帳で黄色。期限内提出率に入らない</small></label>
      <label data-v="grace"><input type="radio" name="late"> 少しの遅れは期限内あつかい
        <small>欠席・体調不良などへの配慮。1人ずつ登録しなくても、この日数までは期限内になります（土日はとばす）</small>
        <span class="days" id="graceDays"></span></label>
      <label data-v="none"><input type="radio" name="late"> 遅れを区別しない<small>締切後に出しても、ふつうの提出</small></label>
    </div>
  </div>

  <label class="f">出した日 <small>（ふつうは今日のまま）</small></label>
  <input type="date" id="given">

  <button class="go" id="goScan">登録して、読み取りへ</button>
  <button class="sub" id="goSave">登録だけする（続けて別の課題も登録）</button>
  <div id="msg"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const run = (name, ...args) => new Promise((ok, ng) => google.script.run.withSuccessHandler(ok).withFailureHandler(ng)[name](...args));
  let today = '';

  function addDays(key, n) {
    const [y, m, d] = key.split('-').map(Number);
    const dt = new Date(y, m - 1, d + n);
    return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
  }

  function chip(text, onClick) {
    const c = document.createElement('span');
    c.className = 'chip';
    c.textContent = text;
    c.onclick = () => onClick(c);
    return c;
  }

  function init(d) {
    today = d.today;
    $('teacher').value = d.teacher || '';
    $('given').value = today;
    d.subjects.forEach((s) => $('subjects').appendChild(new Option(s, s)));
    $('subject').value = d.lastSubject;
    d.subjects.slice(0, 8).forEach((s) => $('subjectChips').appendChild(chip(s, () => { $('subject').value = s; })));

    const last = d.lastClasses ? d.lastClasses.split(',') : [];
    if (!d.classes.length) $('classes').innerHTML = '<span class="hint">名簿にまだクラスがありません（全員が対象になります）</span>';
    d.classes.forEach((c) => {
      const el = chip(c, (x) => x.classList.toggle('on'));
      el.dataset.cls = c;
      if (last.includes(c)) el.classList.add('on');
      $('classes').appendChild(el);
    });

    const due = [['今日', 0], ['明日', 1], ['あさって', 2], ['3日後', 3], ['1週間後', 7], ['2週間後', 14], ['なし', null]];
    due.forEach(([t, n]) => $('dueChips').appendChild(chip(t, (x) => {
      $('due').value = n === null ? '' : addDays(today, n);
      document.querySelectorAll('#dueChips .chip').forEach((c) => c.classList.remove('on'));
      x.classList.add('on');
    })));
    [1, 2, 3, 5, 7].forEach((n) => {
      const c = chip(n + '日', (x) => { graceDays = n; setLate(n + '日まで期限内'); $('lateBox').classList.remove('ask'); });
      c.dataset.d = n;
      $('graceDays').appendChild(c);
    });
    document.querySelectorAll('#lateOpts label').forEach((l) => l.addEventListener('click', () => {
      setLate(l.dataset.v === 'grace' ? graceDays + '日まで期限内' : (l.dataset.v === 'none' ? '区別しない' : '遅れとして記録'));
      $('lateBox').classList.remove('ask');
    }));
    setLate(d.lastLate || d.defaultLate);
    if (!d.lastLate) $('lateBox').classList.add('ask'); // はじめての先生には、目立たせて聞く
    $('subject').focus();
  }

  // 締切後の扱い：'遅れとして記録' / '3日まで期限内' / '区別しない'
  let lateMode = 'strict', graceDays = 3;
  function setLate(text) {
    const t = String(text || '');
    if (/区別しない/.test(t)) lateMode = 'none';
    else if (/(\d+)日/.test(t)) { lateMode = 'grace'; graceDays = Number(t.match(/(\d+)日/)[1]); }
    else lateMode = 'strict';
    document.querySelectorAll('#lateOpts label').forEach((l) => {
      l.classList.toggle('on', l.dataset.v === lateMode);
      l.querySelector('input').checked = l.dataset.v === lateMode;
    });
    document.querySelectorAll('#graceDays .chip').forEach((c) => c.classList.toggle('on', lateMode === 'grace' && Number(c.dataset.d) === graceDays));
  }
  function lateText() {
    return lateMode === 'none' ? '区別しない' : (lateMode === 'grace' ? graceDays + '日まで期限内' : '遅れとして記録');
  }

  function collect() {
    return {
      late: lateText(),
      teacher: $('teacher').value,
      subject: $('subject').value,
      name: $('name').value,
      classes: [...document.querySelectorAll('#classes .chip.on')].map((c) => c.dataset.cls),
      due: $('due').value,
      given: $('given').value,
    };
  }

  function save(thenScan) {
    if ($('lateBox').classList.contains('ask') && !confirm('「締切を過ぎて出したら？」は「' + lateText() + '」でよいですか？\n（次からはこの選び方が最初から入ります）')) return;
    $('lateBox').classList.remove('ask');
    const btns = [$('goScan'), $('goSave')];
    btns.forEach((b) => { b.disabled = true; });
    run('addTask', collect()).then((r) => {
      if (thenScan) return run('openScanner');
      $('msg').className = 'ok';
      $('msg').textContent = '✓ 登録しました：' + r.label;
      $('name').value = '';
      $('name').focus();
    }).catch((e) => {
      $('msg').className = 'err';
      $('msg').textContent = 'エラー：' + (e && e.message || e);
    }).finally(() => btns.forEach((b) => { b.disabled = false; }));
  }

  $('goScan').onclick = () => save(true);
  $('goSave').onclick = () => save(false);
  $('back').onclick = () => run('openHome');
  run('getTaskFormData').then(init).catch((e) => { $('msg').className = 'err'; $('msg').textContent = 'エラー：' + (e && e.message || e); });
</script>
</body>
</html>
