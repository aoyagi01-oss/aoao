<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<?!= include_('JsBarcode') ?>
<style id="pageCss">
  body { font-family: "Noto Sans JP", sans-serif; margin: 0; color: #222; }
  .sheet { padding: 0; }
  /* 短冊：A4 1ページ＝194mm×270mm（余白8mm）に、高さ22.5mmの短冊を12段。切り取り線は紙の端から端まで通す */
  .page { position: relative; width: 194mm; height: 270mm; overflow: hidden; break-after: page; page-break-after: always; }
  .page:last-child { break-after: auto; page-break-after: auto; }
  .strips { display: grid; grid-auto-rows: 22.5mm; }
  .strip { box-sizing: border-box; display: flex; align-items: center; padding: 0 3mm 0 7mm; overflow: hidden; }
  .strip .who { flex: 0 0 auto; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .strip .gk { font-size: 22pt; font-weight: bold; letter-spacing: 1mm; line-height: 1.1; font-family: Arial, "Noto Sans JP", sans-serif; }
  .strip .nm { font-size: 13pt; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip .cl { font-size: 8pt; color: #555; }
  .strip .bc { flex: 1 1 auto; display: flex; justify-content: center; align-items: center; min-width: 0; }
  .strip svg { height: 17mm; max-width: 100%; }
  .cols1 .who { width: 75mm; }
  .cols2 .who { width: 38mm; }
  .cols2 .strip { padding-left: 6mm; }
  .cols2 .gk { font-size: 18pt; letter-spacing: 0.5mm; }
  .cols2 .nm { font-size: 10.5pt; }
  .cut { position: absolute; left: 0; right: 0; height: 0; border-top: 0.35mm dashed #444; }
  .cut::before { content: "✂"; position: absolute; left: 0.5mm; top: -2.6mm; font-size: 9pt; line-height: 1; background: #fff; color: #222; }
  .vcut { position: absolute; top: 0; width: 0; border-left: 0.35mm dashed #444; }
  .vcut::before { content: "✂"; position: absolute; left: -1.6mm; top: 0.5mm; font-size: 9pt; line-height: 1; background: #fff; transform: rotate(90deg); }
  .roster { width: 100%; border-collapse: collapse; margin-bottom: 6mm; }
  .roster caption { text-align: left; font-weight: bold; font-size: 13pt; padding: 2mm 0; }
  .roster td, .roster th { border: 1px solid #999; padding: 1mm 2mm; font-size: 11pt; }
  .roster tr { break-inside: avoid; page-break-inside: avoid; }
  .roster th.n, .roster td.n { width: 20mm; text-align: center; font-size: 13pt; }
  .roster td.bc { width: 75mm; text-align: center; }
  .roster td.bc svg { height: 17mm; max-width: 73mm; }
  .roster td.chk { width: 30mm; }
  .newpage { break-before: page; page-break-before: always; }
  .tasks { display: grid; grid-template-columns: repeat(2, 1fr); }
  .task { border: 1px dashed #bbb; padding: 3mm; break-inside: avoid; page-break-inside: avoid; text-align: center; }
  .task .name { font-weight: bold; font-size: 12pt; }
  .task .sub { font-size: 10pt; color: #444; }
  .task svg { height: 18mm; max-width: 100%; }
  @page { size: A4; margin: 8mm; }
  @media screen { .page { outline: 1px solid #ccc; margin: 0 auto 12px; box-shadow: 0 1px 4px rgba(0,0,0,.15); background: #fff; } #preview { background: #f1f3f4; } }
  @media print { .controls, #warn, #err { display: none !important; } #preview { padding: 0 !important; background: none !important; } .page { margin: 0 !important; outline: none !important; box-shadow: none !important; } }
</style>
<style>
  .controls { position: sticky; top: 0; background: #f8f9fa; border-bottom: 1px solid #ddd; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; font-size: 13px; z-index: 1; }
  .controls select, .controls input { font-size: 13px; padding: 3px; }
  .controls button { font-size: 14px; padding: 6px 14px; cursor: pointer; }
  .controls .primary { background: #1a73e8; color: #fff; border: none; border-radius: 4px; }
  .controls .note { flex-basis: 100%; color: #666; font-size: 12px; }
  #err { color: #c5221f; font-weight: bold; padding: 10px; }
  #preview { padding: 10px; }
</style>
</head>
<body>
<div class="controls">
  <label>印刷するもの
    <select id="kind">
      <option value="labels">生徒のバーコード（A4・切り取り線つきの短冊）</option>
      <option value="roster">名簿型（先生の手元で読む用）</option>
      <option value="tasks">課題のバーコード（読み取り画面の課題切りかえ用）</option>
    </select>
  </label>
  <label id="clsWrap">クラス <select id="cls"></select></label>
  <label id="colWrap">並べ方 <select id="cols"><option value="1">1列（12枚/ページ）</option><option value="2">2列（24枚/ページ）</option></select></label>
  <label id="copyWrap">1人あたり <input type="number" id="copies" value="1" min="1" max="30" style="width:3.5em"> 枚</label>
  <button class="primary" id="print">🖨 印刷する</button>
  <button id="newtab">別のタブで開く</button>
  <span class="note">印刷の設定は「A4・余白：デフォルト・倍率100%（「ページに合わせる」は切る）」にしてください。点線（✂）にそって裁断機で切ります。読み取りにくいときは、プリンタの品質を上げてください。</span>
</div>
<div id="err"></div>
<div id="warn" style="color:#b06000;font-weight:bold;padding:0 10px"></div>
<div id="preview"><div class="sheet" id="sheet"></div></div>

<script>
  const DATA = <?!= payload ?>;
  const $ = (id) => document.getElementById(id);

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function barcode(value, opt) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    try {
      JsBarcode(svg, value, Object.assign({ format: 'CODE128', width: 2, height: 50, margin: 6, fontSize: 14, displayValue: true }, opt || {}));
    } catch (e) {
      $('err').textContent = 'バーコードを作れませんでした（' + value + '）：' + e;
    }
    return svg;
  }

  function students() {
    const c = $('cls').value;
    return DATA.students.filter((s) => !c || s.cls === c);
  }

  function render() {
    const kind = $('kind').value;
    $('clsWrap').style.display = kind === 'tasks' ? 'none' : '';
    $('copyWrap').style.display = kind === 'labels' ? '' : 'none';
    $('colWrap').style.display = kind === 'labels' ? '' : 'none';
    // 学籍番号が入っていない生徒がいたら知らせる（その生徒はクラス・番号だけが印刷される）
    const noGk = kind === 'tasks' ? [] : students().filter((s) => !s.gakuseki);
    $('warn').textContent = noGk.length ? '⚠ 学籍番号が空欄の生徒がいます（' + noGk.length + '人）：' + noGk.slice(0, 10).map((s) => s.cls + ' ' + s.no + '番 ' + s.name).join('、') + (noGk.length > 10 ? ' …' : '') + '　→ 生徒名簿に学籍番号を入れてから印刷してください' : '';
    const sheet = $('sheet');
    sheet.innerHTML = '';
    $('err').textContent = '';
    if (typeof JsBarcode === 'undefined') {
      $('err').textContent = 'バーコードの部品が読み込めませんでした。メニューの「バーコードをシートに作る」を使ってください。';
      return;
    }

    if (kind === 'labels') {
      const n = Math.max(1, Math.min(30, Number($('copies').value) || 1));
      const cols = Number($('cols').value) || 1;
      const ROWS = 12, H = 22.5;
      const list = [];
      students().forEach((s) => { for (let i = 0; i < n; i++) list.push(s); });
      const per = ROWS * cols;
      for (let p = 0; p < list.length; p += per) {
        const items = list.slice(p, p + per);
        const page = el('div', 'page cols' + cols);
        const box = el('div', 'strips');
        box.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
        items.forEach((s) => {
          const strip = el('div', 'strip');
          const who = el('div', 'who');
          who.appendChild(el('div', 'gk', s.gakuseki || ''));
          who.appendChild(el('div', 'nm', s.name));
          who.appendChild(el('div', 'cl', s.cls + '　' + s.no + '番'));
          strip.appendChild(who);
          const bc = el('div', 'bc');
          bc.appendChild(barcode(s.id, { height: 50, fontSize: 12, margin: 4 }));
          strip.appendChild(bc);
          box.appendChild(strip);
        });
        page.appendChild(box);
        // 切り取り線（ページの端から端まで。使った段の上下すべて）
        const rowsUsed = Math.ceil(items.length / cols);
        for (let r = 0; r <= rowsUsed; r++) {
          const c = el('div', 'cut');
          c.style.top = (r * H) + 'mm';
          if (r === 0) c.style.top = '0.2mm';
          page.appendChild(c);
        }
        if (cols === 2) {
          const v = el('div', 'vcut');
          v.style.left = '97mm';
          v.style.height = (rowsUsed * H) + 'mm';
          page.appendChild(v);
        }
        sheet.appendChild(page);
      }
    } else if (kind === 'roster') {
      const groups = {};
      students().forEach((s) => { (groups[s.cls] = groups[s.cls] || []).push(s); });
      Object.keys(groups).forEach((cls, gi) => {
        const t = el('table', 'roster' + (gi ? ' newpage' : ''));
        t.appendChild(el('caption', '', (DATA.title ? DATA.title + '　' : '') + cls + '　バーコード名簿'));
        const head = el('tr');
        ['学籍番号', '氏名', 'バーコード', 'メモ'].forEach((h, i) => head.appendChild(el('th', i ? '' : 'n', h)));
        t.appendChild(head);
        groups[cls].forEach((s) => {
          const tr = el('tr');
          tr.appendChild(el('td', 'n', s.gakuseki || s.no));
          tr.appendChild(el('td', '', s.name));
          const td = el('td', 'bc');
          td.appendChild(barcode(s.id, { height: 50, fontSize: 13, margin: 4 }));
          tr.appendChild(td);
          tr.appendChild(el('td', 'chk', ''));
          t.appendChild(tr);
        });
        sheet.appendChild(t);
      });
    } else {
      const box = el('div', 'tasks');
      DATA.tasks.forEach((k) => {
        const d = el('div', 'task');
        d.appendChild(el('div', 'sub', (k.subject || '') + (k.due ? '　締切 ' + k.due.replace(/-/g, '/') : '')));
        d.appendChild(el('div', 'name', k.name));
        d.appendChild(barcode(k.id));
        box.appendChild(d);
      });
      sheet.appendChild(box);
    }
    if (!sheet.children.length || !sheet.firstChild.children.length) {
      sheet.appendChild(el('p', '', kind === 'tasks' ? '「課題一覧」に課題がありません。' : '「生徒名簿」に生徒がいません。'));
    }
  }

  const sel = $('cls');
  sel.appendChild(new Option('すべてのクラス', ''));
  [...new Set(DATA.students.map((s) => s.cls))].forEach((c) => sel.appendChild(new Option(c, c)));
  ['kind', 'cls', 'copies', 'cols'].forEach((id) => $(id).addEventListener('change', render));

  $('print').addEventListener('click', () => window.print());
  // ダイアログの中から印刷できないブラウザ向け：別タブに同じ内容を出して印刷する
  $('newtab').addEventListener('click', () => {
    const w = window.open('', '_blank');
    if (!w) { alert('ポップアップがブロックされました。アドレスバー右のマークから許可してください。'); return; }
    w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>バーコード</title><style>' +
      $('pageCss').textContent + '</style></head><body>' + $('sheet').outerHTML + '</body></html>');
    w.document.close();
    setTimeout(() => w.print(), 500);
  });

  render();
</script>
</body>
</html>
